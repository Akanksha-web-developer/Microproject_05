<html>

<head>
    <title>Coding</title>
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.15) 100%), radial-gradient(at top center, rgba(255, 255, 255, 0.40) 0%, rgba(0, 0, 0, 0.40) 120%) #989898;
            background-blend-mode: multiply, multiply;
            text-align: center;
            padding: 20px;
            color: rgb(0, 0, 0);
        }

        p {
            float: left;
            font-family: perpetua;
            font-size: 35px;
            font-weight: bold;
        }

        .con {
            display: block;
            margin: auto;
            width: 70%;
            padding: 25px;
            color: black;
            background-color: transparent;
            text-align: justify;
        }

        .main {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        img {
            height: 300px;
            width: 400px;
            margin: 20px;
            border-radius: 15px;
        }

        h1 {
            font-size: 35px;
        }

        @media (max-width: 576px) {
            p{
                font-size: 15px;
            }

            .con{
                display: block;
                margin: auto;
                margin-top: 12px;
                margin-bottom: 20px;
                width: 65%;
                padding: 5px;
                text-align: justify;
                height: auto;
            }

            .main{
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            h1{
                margin-top: 12px;
                font-size: 20px;
            }
            
            img{
                margin: 20px;
                height: 200px;
                width: 220px;
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>
    <h1>Coding</h1>
    <div class="main">
        <div class="con">
            <p>
                Coding is one of my key interests as it helps me think
                logically . Recently, I have learnt C Programming language.
                It includes many interesting concepts that helps us to improve
                our problem solving skills and also give knowledge that
                how technology actually works.
            </p>
        </div>
       <img src="ci2.jpeg">
      
    </div>
</body>

</html>
