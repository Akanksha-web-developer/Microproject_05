<html>

<head>
    <title>Travelling</title>
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <style>
        body {
            margin: 0;
            background-image: linear-gradient(120deg, #c3d6f4 0%, #c2e9fb 100%);
            text-align: center;
            padding: 20px;
            color: rgb(0, 0, 0);
        }

        p {
            float: left;
            font-family: perpetua;
            font-size: 33px;
            font-weight: bold;
        }

        .con {
            display: block;
            margin: auto;
            width: 70%;
            padding: 25px;
            color: black;
            background-color: transparent;
            text-align: justify;
        }

        .main {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        img {
            height: 350px;
            width: 400px;
            margin: 20px;
            border-radius: 15px;
        }

        h1 {
            font-size: 35px;
        }

        @media (max-width: 576px) {
            p{
                font-size: 15px;
            }

            .con{
                display: block;
                margin: auto;
                margin-top: 12px;
                margin-bottom: 20px;
                width: 65%;
                padding: 5px;
                text-align: justify;
                height: auto;
            }

            .main{
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            h1{
                margin-top: 12px;
                font-size: 20px;
            }
            
            img{
                margin: 20px;
                height: 200px;
                width: 220px;
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>
    <h1>Travelling</h1>
    <div class="main">
    <div class="con">
        <p>
            Travelling is one of my favorite interests as it
            allows me to explore new places, experience
            different cultures,and learn new things.
            It refreshes my mind and gives me new
            perspectives. It also creates memorable
            experiences and moments that I truly enjoy.
        </p>
    </div>
    <img src="t1.jpeg">
    </div>
</body>

</html>
