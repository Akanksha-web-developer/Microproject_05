<html>

<head>
    <title>Watching Movies</title>
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <style>
        body {
            margin: 0;
            background-image: linear-gradient(to top, #564c4a 0%, #543f39 100%);
            text-align: center;
            padding: 20px;
            color: rgb(255, 255, 255);
        }

        p {
            float: left;
            font-family: perpetua;
            font-size: 35px;
            font-weight: bold;
        }

        h1 {
            margin: 10px;
            font-size: 35px;
            text-align: center;
        }

        .main {
            display: flex;
            flex-direction: row;
            align-items: center;
            margin: 30px;
        }
        
        .con {
            display: block;
            margin: auto;
            width: 65%;
            padding: 25px;
            color: rgb(236, 236, 236);
            background-color: transparent;
            text-align: justify;
        }

        img {
            height: 250px;
            width: 300px;
            margin: 20px;
        }

        @media (max-width: 576px) {
            p {
                font-size: 15px;
            }

            .con {
                display: block;
                margin: auto;
                margin-bottom: 15px;
                width: 65%;
                padding: 5px;
                text-align: left;
                height: auto;
            }

            .main {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            h1 {
                margin-top: 15px;
                font-size: 12px;
            }

            img{
                 margin: 20px;
                height: 200px;
                width: 220px;
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>
    <h1>Watching Movies🍿</h1>
    <div class="main">
        <div class="con">
            <p>
                Watching Movies is great way to have fun.
                I enjoy different genres like comedy, 
                action, and drama, as each movie brings 
                a new story and emotions. 
                Spending time watching films with friends or 
                family makes the experience even more enjoyable and memorable.
            </p>
        </div>
        <img src="m1.jpeg">
    </div>

</body>

</html>
