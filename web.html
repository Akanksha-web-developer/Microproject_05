<html>

<head>
    <title>Web page designing</title>
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <style>
        body {
            margin: 0;
            background-image: linear-gradient(-20deg, #2b5876 0%, #4e4376 100%);
            text-align: center;
            padding: 20px;
            color: white;
        }

        p {
            float: left;
            font-family: perpetua;
            font-size: 35px;
            font-weight: bold;
        }

        .con {
            display: block;
            margin: auto;
            width: 70%;
            padding: 25px;
            color: rgb(225, 223, 223);
            background-color: transparent;
            text-align: justify;
        }

        .main {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        h1 {
            font-size: 35px;
        }

        img
        {
            margin: 30px;
            height: 400px;
            width: 400px;
            border-radius: 25px ;
        }

        @media (max-width: 576px) {
            p{
                font-size: 15px;
            }

            .con{
                display: block;
                margin: auto;
                margin-top: 12px;
                margin-bottom: 20px;
                width: 65%;
                padding: 5px;
                text-align: justify;
                height: auto;
            }

            .main{
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            h1{
                margin-top: 12px;
                font-size: 20px;
            }
            
            img{
                margin: 20px;
                height: 200px;
                width: 220px;
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>
    <center>
        <h1>Web Page Designing</h1>
    </center>
    <div class="main">
        
        <div class="con">
            
            <p>
                Web designing interests me as it allows me
                to design creative and engaging web pages while
                improving both my technical and creative abilities.
                <br>Till now, I have created many web pages using html and basic CSS styles.
            </p>
        </div>
        <img src="whtml.gif">
    </div>
</body>

</html>
