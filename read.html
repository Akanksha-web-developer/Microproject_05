<html>

<head>
    <title>Reading</title>
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <style>
        body {
            margin: 0;
            background-image: linear-gradient(to left, #ffecd2 0%, #f9bfac 100%);
            text-align: center;
            padding: 20px;
            color: rgb(0, 0, 0);
        }

        p {
            float: left;
            font-family: perpetua;
            font-size: 35px;
            font-weight: bold;
        }

        .con {
            display: block;
            margin: auto;
            width: 70%;
            padding: 25px;
            color: black;
            background-color: transparent;
            text-align: justify;
        }

        .main {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        img {
            height: 350px;
            width: 400px;
            margin: 20px;
            border-radius: 15px;
        }

        h1 {
            font-size: 35px;
        }

        @media (max-width: 576px) {
            p{
                font-size: 15px;
            }

            .con{
                display: block;
                margin: auto;
                margin-top: 12px;
                margin-bottom: 20px;
                width: 65%;
                padding: 5px;
                text-align: justify;
                height: auto;
            }

            .main{
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            h1{
                margin-top: 12px;
                font-size: 20px;
            }
            
            img{
                margin: 20px;
                height: 200px;
                width: 220px;
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>
     <h1>Reading</h1>
<div class="main">
   
    <div class="con">
        <p>
            Reading is one of my favourite in interests.
            I mostly love to read fiction books,
            as they include lots of imaginary content.
            <br>Harry Potter is my all-time favorite book.
            Books not only helps us to gain knowledge,
            but also they change the way of thinking about world.

        </p>
    </div>
    <img src="re1.avif">
    </div>
</body>

</html>
